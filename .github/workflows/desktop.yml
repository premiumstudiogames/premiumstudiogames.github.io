name: Build Premium Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build and publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
      - name: Put the installer on the store site
        shell: bash
        run: |
          git config user.name "Premium Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp desktop/dist/PremiumStudioSetup.exe docs/downloads/PremiumStudioSetup.exe
            git add docs/downloads/PremiumStudioSetup.exe
            git commit -m "Update Windows installer" || exit 0
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
