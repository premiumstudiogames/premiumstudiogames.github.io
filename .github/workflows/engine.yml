name: Premium Engine (Windows, Linux, macOS)

# Builds the C++ engine (editor + game player) for Windows (MSVC), Linux and macOS (Apple Silicon + Intel), runs the
# engine tests on each, starts the editor and packaged games for real (software OpenGL), and publishes
# PremiumEngine-<version>-Windows.zip (with the Linux and macOS game players inside, so Platforms > Linux / macOS
# package from Windows), PremiumEngine-<version>-Linux.zip and PremiumEngine-<version>-macOS.zip as a GitHub release.
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/engine.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # an older system: the program runs on most Linux computers (glibc 2.35+)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Libraries to build against (SDL loads them when the game runs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb mesa-utils libgl1-mesa-dri libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxfixes-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev unzip zip
      - name: Configure
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Engine tests
        run: xvfb-run -a build/PremiumEngineTests
      - name: Editor self-tests (new project, play, package; Blueprints; models, foliage, destruction, cloth, LOD, occlusion, GI, Linux / macOS packages)
        timeout-minutes: 30
        run: |
          mkdir -p selftest/model selftest/blueprint
          xvfb-run -a -s "-screen 0 1600x900x24" build/PremiumEngine --selftest "$PWD/selftest" || { cat selftest/editor-result.txt; exit 1; }
          head -4 selftest/editor-result.txt
          xvfb-run -a -s "-screen 0 1600x900x24" build/PremiumEngine --home "$PWD/selftest/blueprint/home" --bptest "$PWD/selftest/blueprint" || { cat selftest/blueprint/bp-result.txt; exit 1; }
          PGE_MT_VARIANT=nomsaa timeout 1500 xvfb-run -a -s "-screen 0 1600x900x24" build/PremiumEngine --home "$PWD/selftest/model/home" --modeltest "$PWD/selftest/model" || { cat selftest/model/model-result.txt; tail -40 selftest/model/model-progress.txt; exit 1; }
          head -40 selftest/model/model-result.txt
      - name: The packaged Linux game, from its zip (walks forward)
        timeout-minutes: 10
        run: |
          Z=$(ls selftest/model/home/Builds/*/*-Linux.zip | head -1); mkdir -p unz st; unzip -q "$Z" -d unz; N=$(ls unz)
          ls -la "unz/$N"; test -x "unz/$N/$N"
          (cd "unz/$N" && xvfb-run -a sh "./$N.sh" --selftest "$GITHUB_WORKSPACE/st") || { cat st/player-result.txt; exit 1; }
          cat st/player-result.txt
      - name: Keep the Linux programs
        run: |
          mkdir -p out && cp build/PremiumEngine build/PremiumEnginePlayer out/ && cp -r build/assets out/ && cp build/version.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: engine-linux
          path: out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: selftest

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }    # Apple Silicon
          - { runner: macos-15-intel, arch: x86_64 }   # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          brew list ninja > /dev/null 2>&1 || brew install ninja
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --parallel
      - name: Engine tests
        run: build/PremiumEngineTests
      - name: A game played by the player program (Third Person template, walks forward)
        timeout-minutes: 10
        run: |
          mkdir -p st && build/PremiumEngineTests --write-template ThirdPerson "$PWD/st/game.pge.json"
          cp -r build/assets st/ 2>/dev/null || true
          build/PremiumEnginePlayer --game "$PWD/st/game.pge.json" --selftest "$PWD/st" || { cat st/player-result.txt; exit 1; }
          cat st/player-result.txt
      - name: Keep the programs
        run: |
          mkdir -p out && cp build/PremiumEngine build/PremiumEnginePlayer out/ && cp -r build/assets out/
      - uses: actions/upload-artifact@v4
        with:
          name: engine-macos-${{ matrix.arch }}
          path: out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-macos-${{ matrix.arch }}
          path: st

  macos-universal:   # one program for both kinds of Mac
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos-arm64
          path: arm
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos-x86_64
          path: x64
      - name: lipo
        run: |
          mkdir -p out && cp -r arm/assets out/
          for p in PremiumEngine PremiumEnginePlayer; do lipo -create "arm/$p" "x64/$p" -output "out/$p"; chmod +x "out/$p"; lipo -info "out/$p"; done
      - uses: actions/upload-artifact@v4
        with:
          name: engine-macos
          path: out

  windows:
    needs: [linux, macos-universal]
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests (project files, physics, scripts, game rules)
        run: build\Release\PremiumEngineTests.exe

      - name: Software OpenGL for the test machine (the CI runner has no GPU)
        shell: bash
        run: |
          gh release download 24.3.4 -R pal1000/mesa-dist-win -p "mesa3d-*-release-msvc.7z" -D mesa
          ls -la mesa
          7z x mesa/*.7z -omesa/x -y | tail -3
          find mesa/x -iname "*.dll" | head -60
          GL=$(find mesa/x -iname opengl32.dll | grep -iv "x86\|arm" | head -1)
          [ -n "$GL" ] || { echo "opengl32.dll not found in the Mesa package"; exit 1; }
          echo "Mesa OpenGL: $GL"; ls "$(dirname "$GL")"
          echo "MESA_DIR=$(cygpath -w "$PWD/$(dirname "$GL")")" >> "$GITHUB_ENV"
          mkdir -p run
          cp -r build/Release/* run/
          cp "$(dirname "$GL")"/*.dll run/

      - uses: actions/download-artifact@v4
        with:
          name: engine-linux
          path: players-linux
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos
          path: players-macos
      - name: The Linux and macOS game players next to the editor (Platforms > Linux / macOS)
        shell: bash
        run: |
          for d in run build/Release; do mkdir -p $d/players/linux $d/players/macos; cp players-linux/PremiumEnginePlayer $d/players/linux/; cp players-macos/PremiumEnginePlayer $d/players/macos/; done
          ls -la run/players/*

      - name: Editor self-test (new project, play, package)
        timeout-minutes: 15
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          export SDL_OPENGL_LIBRARY="$MESA_DIR\\opengl32.dll"
          mkdir -p selftest
          ./run/PremiumEngine.exe --selftest "$PWD/selftest" || { cat selftest/editor-result.txt; exit 1; }
          cat selftest/editor-result.txt | head -4
          # the console version: full screen, its own folder, the on-screen keyboard and the sticks
          mkdir -p selftest/console
          ./run/PremiumEngine.exe --console --home "$PWD/selftest/console/home" --consoletest "$PWD/selftest/console" || { cat selftest/console/console-result.txt; exit 1; }
          cat selftest/console/console-result.txt
          # Blueprints: the editor used with the mouse (a wire dragged, a node searched and added), then Play
          mkdir -p selftest/blueprint
          ./run/PremiumEngine.exe --home "$PWD/selftest/blueprint/home" --bptest "$PWD/selftest/blueprint" || { cat selftest/blueprint/bp-result.txt; exit 1; }
          cat selftest/blueprint/bp-result.txt
          # models and textures: a .glb dropped on the viewport, drawn with its picture, its animation bending it, a texture on a material, Play, Package
          mkdir -p selftest/model
          # the software driver of this machine (Mesa llvmpipe 24 on Windows) stalls on a Play over a landscape with MSAA + shadows + bloom +
          # reflection captures all on (each one alone is fine, Linux Mesa 25 is fine): this test plays it without MSAA
          PGE_MT_VARIANT=nomsaa timeout 420 ./run/PremiumEngine.exe --home "$PWD/selftest/model/home" --modeltest "$PWD/selftest/model" || { cat selftest/model/model-result.txt; cat selftest/model/stopped.txt; head -3 selftest/model/model-progress.txt; tail -40 selftest/model/model-progress.txt; exit 1; }
          head -20 selftest/model/model-result.txt

      - name: Packaged game self-test (walks forward)
        timeout-minutes: 10
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          export SDL_OPENGL_LIBRARY="$MESA_DIR\\opengl32.dll"
          GAME=$(ls -d "$USERPROFILE"/Documents/PremiumEngine/Builds/*/Windows | head -1)
          NAME=$(basename "$(dirname "$GAME")")
          cp "$(cygpath -u "$MESA_DIR")"/*.dll "$GAME/"
          ls -la "$GAME"
          "$GAME/$NAME.exe" --selftest "$PWD/selftest" || { cat selftest/player-result.txt; exit 1; }
          cat selftest/player-result.txt

      - name: Block world self-test (Block World template, walks forward)
        timeout-minutes: 10
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          export SDL_OPENGL_LIBRARY="$MESA_DIR\\opengl32.dll"
          mkdir -p selftest/blocks
          ./build/Release/PremiumEngineTests.exe --write-template Blocks "$PWD/selftest/blocks/game.pge.json"
          ./run/PremiumEnginePlayer.exe --game "$PWD/selftest/blocks/game.pge.json" --selftest "$PWD/selftest/blocks" || { cat selftest/blocks/player-result.txt; exit 1; }
          cat selftest/blocks/player-result.txt

      - name: BLOCKFALL on the engine (games/blockfall), walks forward
        if: hashFiles('games/blockfall/BLOCKFALL.pge.json') != ''
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          export SDL_OPENGL_LIBRARY="$MESA_DIR\\opengl32.dll"
          mkdir -p selftest/blockfall
          ./run/PremiumEnginePlayer.exe --game "$PWD/games/blockfall/BLOCKFALL.pge.json" --selftest "$PWD/selftest/blockfall" || { cat selftest/blockfall/player-result.txt; exit 1; }
          cat selftest/blockfall/player-result.txt

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: selftest

      - name: Zip
        id: zip
        shell: bash
        run: |
          VER=$(cat build/version.txt)
          mkdir -p dist/PremiumEngine
          cp build/Release/PremiumEngine.exe build/Release/PremiumEnginePlayer.exe dist/PremiumEngine/
          cp -r build/Release/assets dist/PremiumEngine/
          cp native/README.md dist/PremiumEngine/README.md
          cp native/THIRD_PARTY.md dist/PremiumEngine/THIRD_PARTY.md
          mkdir -p dist/PremiumEngine/players/linux dist/PremiumEngine/players/macos
          cp players-linux/PremiumEnginePlayer dist/PremiumEngine/players/linux/; cp players-macos/PremiumEnginePlayer dist/PremiumEngine/players/macos/
          cd dist && 7z a -tzip "PremiumEngine-$VER-Windows.zip" PremiumEngine > /dev/null
          ls -la
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows-player
          path: build/Release/PremiumEnginePlayer.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VER=${{ steps.zip.outputs.ver }}
          TAG="engine-$VER"
          ZIP="dist/PremiumEngine-$VER-Windows.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "Premium Engine $VER (experimental)" --notes-file native/RELEASE.md --prerelease --latest=false
          fi
          # engine builds must never be the repo's "latest" release: the Premium Games app updates itself from that one
          for t in $(gh api "repos/${{ github.repository }}/releases?per_page=50" -q '.[]|select(.tag_name|startswith("engine-"))|select(.prerelease==false)|.tag_name'); do
            gh release edit "$t" --prerelease --latest=false
          done
          APP=$(gh api "repos/${{ github.repository }}/releases?per_page=50" -q '[.[]|select(.tag_name|startswith("v"))|select(.draft==false and .prerelease==false)][0].tag_name')
          [ -n "$APP" ] && gh release edit "$APP" --latest
          echo "latest release: $(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name)"

      # Premium Games reads this list to install / update the engine (like Epic Games Launcher does for Unreal)
      - name: Update engine/versions.json
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VER=${{ steps.zip.outputs.ver }}
          ZIP="dist/PremiumEngine-$VER-Windows.zip"
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$ZIP")
          URL="https://github.com/${{ github.repository }}/releases/download/engine-$VER/PremiumEngine-$VER-Windows.zip"
          git config user.name "Premium Games bot"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node -e '
              const fs = require("fs"), f = "docs/engine/versions.json";
              let j = {}; try { j = JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) {}
              const [ver, url, sha256, size] = process.argv.slice(1);
              j.versions = (j.versions || []).filter(v => v.version !== ver);
              j.versions.push({ version: ver, url, sha256, size: +size, at: new Date().toISOString() });
              j.versions.sort((a, b) => b.version.localeCompare(a.version, "en", { numeric: true }));
              j.latest = j.versions[0].version;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");' "$VER" "$URL" "$SHA" "$SIZE"
            git add docs/engine/versions.json
            git diff --cached --quiet && break
            git commit -q -m "Premium Engine $VER: versions.json (Windows build)" && git push -q origin HEAD:main && break
            sleep 5
          done

  unix-zips:   # the editor for Linux and for macOS (zipped here: the programs stay executable), each with the other systems' game players
    needs: windows
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos
          path: macos
      - uses: actions/download-artifact@v4
        with:
          name: engine-windows-player
          path: win
      - name: Zip
        run: |
          VER=$(cat linux/version.txt); mkdir -p dist
          for os in Linux macOS; do src=linux; other=macos; [ $os = macOS ] && { src=macos; other=linux; }
            D=stage/$os/PremiumEngine; mkdir -p $D/players/windows $D/players/$other
            cp $src/PremiumEngine $src/PremiumEnginePlayer $D/; cp -r $src/assets $D/; cp native/README.md native/THIRD_PARTY.md $D/
            cp win/PremiumEnginePlayer.exe $D/players/windows/; cp $other/PremiumEnginePlayer $D/players/$other/
            chmod +x $D/PremiumEngine $D/PremiumEnginePlayer $D/players/$other/PremiumEnginePlayer
            (cd stage/$os && zip -qr "../../dist/PremiumEngine-$VER-$os.zip" PremiumEngine); done
          ls -la dist; unzip -Z dist/PremiumEngine-$VER-Linux.zip | grep -E "PremiumEngine(Player)?$"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-unix-zips
          path: dist
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: gh release upload "engine-$VER" dist/*.zip --clobber -R ${{ github.repository }}
