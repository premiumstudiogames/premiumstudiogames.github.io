name: Firestore rules tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules', 'tests/**', '.github/workflows/rules.yml']

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm i --no-save --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Test
        run: npx firebase emulators:exec --only firestore --project premium-studio-test "node tests/rules.test.mjs"
