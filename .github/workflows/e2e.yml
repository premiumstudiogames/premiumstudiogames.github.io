name: Windows end-to-end check

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Play the games for real
        working-directory: desktop
        run: npx electron test/e2e.js
      - name: Result
        if: always()
        shell: bash
        run: cat desktop/test/e2e-result.txt || true
